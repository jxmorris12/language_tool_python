name: language_tool_python CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 20
    name: Test on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC authentication
    strategy:
      fail-fast: false
      matrix:
        # Execute tests on python 3.10-3.15 on ubuntu
        # and python 3.14 on macOS and windows
        include:
          - os: ubuntu-26.04
            python-version: "3.10"
          - os: ubuntu-26.04
            python-version: "3.11"
          - os: ubuntu-26.04
            python-version: "3.12"
          - os: ubuntu-26.04
            python-version: "3.13"
          - os: ubuntu-26.04
            python-version: "3.14"
          - os: ubuntu-26.04
            python-version: "3.15.0-rc.2"
          - os: macos-26
            python-version: "3.14"
          - os: windows-2025
            python-version: "3.14"

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # 10.1.0
    
    - name: Set up JDK 26
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
      with:
        distribution: 'temurin'
        java-version: '26'

    - name: Clone repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      with:
        persist-credentials: false

    - name: Test with pytest
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        uv run --python "$PYTHON_VERSION" --group tests --locked pytest

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    timeout-minutes: 10
    name: Lint with Ruff
    runs-on: ubuntu-26.04
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # 10.1.0

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Run Ruff Linter
        run: |
          make ruff-check
  
  type_check:
    timeout-minutes: 10
    name: Type Check with Mypy
    runs-on: ubuntu-26.04
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # 10.1.0

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Run Mypy Type Checker
        run: | 
          make mypy-check
