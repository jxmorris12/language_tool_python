version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
  
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
